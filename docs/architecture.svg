<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a37"/>
    </marker>
  </defs>
  <style>
    .title { font-size: 24px; font-weight: 650; fill: #1f1f1d; }
    .sub { font-size: 15px; fill: #6b6a66; }
    .layer { stroke-width: 1.4; rx: 16; }
    .agentic { fill: #eef1fb; stroke: #3b5bdb; }
    .reliability { fill: #f3f2ee; stroke: #2f2f2c; }
    .card { fill: #ffffff; stroke: #c9c7c0; stroke-width: 1.2; rx: 12; }
    .layer-name { font-size: 18px; font-weight: 650; }
    .layer-note { font-size: 14px; fill: #6b6a66; }
    .name { font-size: 16px; font-weight: 650; fill: #1f1f1d; }
    .what { font-size: 13.5px; fill: #3a3a37; }
    .end { fill: #ffffff; stroke: #c9c7c0; stroke-width: 1.2; rx: 12; }
    .human { fill: #f8f2ec; stroke: #6f4e37; stroke-width: 1.4; rx: 12; }
    .db { fill: #fbf3e1; stroke: #b7791f; stroke-width: 1.4; rx: 12; }
    .edge { stroke: #3a3a37; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .label { font-size: 13px; fill: #3a3a37; }
  </style>

  <text x="40" y="46" class="title">Agentic Database Security Remediation</text>
  <text x="40" y="70" class="sub">Agents propose. The reliability layer decides. A human approves. From finding to verified recovery.</text>

  <!-- Finding in -->
  <rect x="40" y="250" width="130" height="80" class="end"/>
  <text x="105" y="284" class="name" text-anchor="middle">Finding</text>
  <text x="105" y="306" class="what" text-anchor="middle">excessive privilege</text>

  <!-- Agentic layer -->
  <rect x="210" y="110" width="760" height="190" class="layer agentic"/>
  <text x="232" y="140" class="layer-name" fill="#3b5bdb">Agentic layer</text>
  <text x="232" y="160" class="layer-note">Four agents reason and propose. They act only through allowlisted tools and never change state themselves.</text>

  <rect x="232" y="180" width="170" height="96" class="card"/>
  <text x="317" y="210" class="name" text-anchor="middle">Analysis</text>
  <text x="317" y="232" class="what" text-anchor="middle">reads the role, telemetry</text>
  <text x="317" y="250" class="what" text-anchor="middle">and history; proposes a plan</text>

  <rect x="418" y="180" width="170" height="96" class="card"/>
  <text x="503" y="210" class="name" text-anchor="middle">Remediation</text>
  <text x="503" y="232" class="what" text-anchor="middle">applies the approved plan</text>
  <text x="503" y="250" class="what" text-anchor="middle">by reference, once</text>

  <rect x="604" y="180" width="170" height="96" class="card"/>
  <text x="689" y="210" class="name" text-anchor="middle">Verification</text>
  <text x="689" y="232" class="what" text-anchor="middle">interprets checks computed</text>
  <text x="689" y="250" class="what" text-anchor="middle">before it sees them</text>

  <rect x="790" y="180" width="160" height="96" class="card"/>
  <text x="870" y="210" class="name" text-anchor="middle">Supervision</text>
  <text x="870" y="232" class="what" text-anchor="middle">classifies drift and</text>
  <text x="870" y="250" class="what" text-anchor="middle">recommends reopening</text>

  <!-- Human approval -->
  <rect x="1010" y="180" width="150" height="96" class="human"/>
  <text x="1085" y="210" class="name" text-anchor="middle" fill="#6f4e37">Human approval</text>
  <text x="1085" y="232" class="what" text-anchor="middle">a named approver binds</text>
  <text x="1085" y="250" class="what" text-anchor="middle">to the exact plan</text>

  <!-- Reliability layer -->
  <rect x="210" y="330" width="760" height="190" class="layer reliability"/>
  <text x="232" y="360" class="layer-name" fill="#2f2f2c">Reliability layer</text>
  <text x="232" y="380" class="layer-note">Deterministic controls enforce policy, guard every write and prove the outcome. Nothing executes without them.</text>

  <rect x="232" y="400" width="136" height="96" class="card"/>
  <text x="300" y="430" class="name" text-anchor="middle">Leases</text>
  <text x="300" y="452" class="what" text-anchor="middle">one executor, even</text>
  <text x="300" y="470" class="what" text-anchor="middle">under duplicates</text>

  <rect x="380" y="400" width="136" height="96" class="card"/>
  <text x="448" y="430" class="name" text-anchor="middle">Idempotency</text>
  <text x="448" y="452" class="what" text-anchor="middle">change and marker</text>
  <text x="448" y="470" class="what" text-anchor="middle">commit together</text>

  <rect x="528" y="400" width="146" height="96" class="card"/>
  <text x="601" y="430" class="name" text-anchor="middle">Reconciliation</text>
  <text x="601" y="452" class="what" text-anchor="middle">uncertain outcomes are</text>
  <text x="601" y="470" class="what" text-anchor="middle">resolved, not retried</text>

  <rect x="686" y="400" width="130" height="96" class="card"/>
  <text x="751" y="430" class="name" text-anchor="middle">Verification</text>
  <text x="751" y="452" class="what" text-anchor="middle">assertions, probes,</text>
  <text x="751" y="470" class="what" text-anchor="middle">app scenarios</text>

  <rect x="828" y="400" width="122" height="96" class="card"/>
  <text x="889" y="430" class="name" text-anchor="middle">Drift detection</text>
  <text x="889" y="452" class="what" text-anchor="middle">fingerprint poll,</text>
  <text x="889" y="470" class="what" text-anchor="middle">reopen on change</text>

  <!-- Database -->
  <rect x="1010" y="400" width="150" height="96" class="db"/>
  <text x="1085" y="430" class="name" text-anchor="middle" fill="#b7791f">PostgreSQL</text>
  <text x="1085" y="452" class="what" text-anchor="middle">the only thing that</text>
  <text x="1085" y="470" class="what" text-anchor="middle">changes, one transaction</text>

  <!-- Outcome -->
  <rect x="40" y="440" width="130" height="80" class="end"/>
  <text x="105" y="474" class="name" text-anchor="middle">Verified</text>
  <text x="105" y="494" class="name" text-anchor="middle">recovery</text>

  <!-- Edges -->
  <line x1="170" y1="290" x2="210" y2="230" class="edge"/>
  <line x1="950" y1="228" x2="1010" y2="228" class="edge"/>
  <text x="980" y="216" class="label" text-anchor="middle">plan</text>
  <line x1="1085" y1="276" x2="1085" y2="400" class="edge"/>
  <text x="1096" y="342" class="label">approved</text>
  <line x1="500" y1="300" x2="500" y2="330" class="edge"/>
  <text x="490" y="320" class="label" text-anchor="end">tool calls</text>
  <line x1="680" y1="330" x2="680" y2="300" class="edge"/>
  <text x="690" y="320" class="label">results, refusals</text>
  <line x1="970" y1="448" x2="1010" y2="448" class="edge"/>
  <line x1="1010" y1="470" x2="970" y2="470" class="edge"/>
  <line x1="210" y1="470" x2="170" y2="470" class="edge"/>
  <text x="190" y="458" class="label" text-anchor="middle">evidence</text>

  <text x="40" y="600" class="sub">Demo mode: recorded agents, a simulated PostgreSQL target and demo personas. The reliability layer runs live on every step.</text>
</svg>
